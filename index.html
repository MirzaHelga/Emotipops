<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmotiPops | Fruity Gummy Candy, Bursting with Mood</title>
<meta name="description" content="EmotiPops gummy candy — playful fruit-flavored gummies bursting with fruit extract and Vitamin C.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@400;500&family=Manrope:wght@400;700&family=Galada&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages/index.css">
</head>
<body>

<div id="bubbles-container"></div>

<header class="header">
    <div class="logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
            <path d="M12 8V16M8 12H16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <img src="assets/picture/Logo_FOX_S_GummyCandy.png" alt="FOX'S Gummy Candy" class="header-logo-img">
    </div>
    <nav class="nav glass">
        <a href="index.html" class="nav-item active">Home</a>
        <a href="flavours.html" class="nav-item">Flavours</a>
        <a href="ingredients.html" class="nav-item">Ingredients</a>
        <a href="find-us.html" class="nav-item">Find Us</a>
        <a href="galeri.html" class="nav-item">Galeri</a>
    </nav>
    <button class="contact-btn">Contact Us</button>
</header>

<main class="hero">
    <div class="hero-content">

        <div class="leaves-container">
            <model-viewer class="leaf l1" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/leaves.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="45deg 75deg 105%"></model-viewer>
            <model-viewer class="leaf l2" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/leaves.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="-30deg 60deg 105%"></model-viewer>
            <model-viewer class="leaf l3" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/leaves.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="120deg 85deg 105%"></model-viewer>
            <model-viewer class="leaf l4" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/leaves.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="10deg 45deg 105%"></model-viewer>
        </div>

        <div class="hero-left">
            <h1 class="main-title large-animation-1">
                <img id="variant-logo" class="main-title-logo" src="assets/picture/Emotipops_LoveAngry.png" alt="EmotiPops Love & Angry">
            </h1>
            <p class="description">
                Playful gummy candy bursting with real fruit extract. <br>
                Every shape has a mood, every bite has a flavor <br>
            </p>
            <div class="cta-group">
                <button class="primary-btn">
                    Shop Now
                    <span class="plus-icon">+</span>
                </button>
            </div>
            <div class="award-badge">
                <div class="award-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 15L15 18L19 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M7 10L12 15L17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
                <div class="award-text">
                    <span class="award-title">KIDS' CHOICE AWARDS</span>
                    <span class="award-subtitle">FAVORITE CANDY 2025</span>
                </div>
            </div>
        </div>

        <div class="berries-container-bg">
            <model-viewer class="berry b7" src="assets/glb/Lychee.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="-20deg 110deg 105%"></model-viewer>
            <model-viewer class="berry b8" src="assets/glb/Wildberry.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="160deg 45deg 105%"></model-viewer>
            <model-viewer class="berry b9" src="assets/glb/Orange.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="45deg 20deg 105%"></model-viewer>
        </div>

        <div class="hero-center">
            <model-viewer id="product-model" src="assets/glb/Gummy2.glb" alt="EmotiPops 3D Gummy Model" camera-controls
                disable-zoom shadow-intensity="0" environment-image="neutral" exposure="1.5"
                interaction-prompt="none" camera-orbit="0deg 90deg 380%" field-of-view="30deg"
                class="main-product-3d">
            </model-viewer>
        </div>

        <div class="berries-container">
            <model-viewer class="berry b1" src="assets/glb/Lychee.glb" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="45deg 120deg 105%"></model-viewer>
            <model-viewer class="berry b2" src="assets/glb/Wildberry.glb" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="-120deg 45deg 105%"></model-viewer>
            <model-viewer class="berry b3" src="assets/glb/Orange.glb" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="200deg 90deg 105%"></model-viewer>
            <model-viewer class="berry b4" src="assets/glb/Lychee.glb" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="10deg 20deg 105%"></model-viewer>
            <model-viewer class="berry b5" src="assets/glb/Wildberry.glb" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="-45deg 160deg 105%"></model-viewer>
            <model-viewer class="berry b6" src="assets/glb/Orange.glb" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="80deg 75deg 105%"></model-viewer>
        </div>

        <div class="hero-right">
            <div class="product-carousel">
                <div class="carousel-cards">
                    <div class="card active" data-flavor="love-angry">
                        <div class="card-img-wrap">
                            <img src="assets/picture/Gummy2_picture.png" alt="EmotiPops Love & Angry">
                        </div>
                        <div class="card-info">
                            <span>Love & Angry</span>
                            <span>Lychee, Wildberry & Orange</span>
                        </div>
                    </div>
                    <div class="card" data-flavor="happy-sad">
                        <div class="card-img-wrap">
                            <img src="assets/picture/Gummy1_picture.png" alt="EmotiPops Happy & Sad" style="filter: brightness(0.7);">
                        </div>
                        <div class="card-info">
                            <span>Happy & Sad</span>
                            <span>Blackcurrant, Strawberry, Lemon & Mango</span>
                        </div>
                    </div>
                </div>
                <div class="carousel-nav">
                    <button class="nav-arrow">←</button>
                    <button class="nav-arrow">→</button>
                </div>
            </div>
            <h2 class="side-title large-animation-1">
                <span class="outline" id="variant-title-line1">Love &amp;</span><br>
                <span id="variant-title-line2">Angry</span>
            </h2>
        </div>

    </div>
</main>

<svg style="position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none;">
    <filter id="frosted">
        <feTurbulence type="fractalNoise" baseFrequency="0.0125" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="80" xChannelSelector="R" yChannelSelector="G" />
    </filter>
</svg>
<div style="display: none;">
    <!-- Preload gummy models to avoid lag during switch -->
    <model-viewer src="assets/glb/Gummy2.glb"></model-viewer>
    <model-viewer src="assets/glb/Gummy2.glb"></model-viewer>
    <model-viewer src="assets/glb/Lychee.glb"></model-viewer>
    <model-viewer src="assets/glb/Wildberry.glb"></model-viewer>
    <model-viewer src="assets/glb/Orange.glb"></model-viewer>
    <model-viewer src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/blueberry.glb"></model-viewer>
    <model-viewer src="assets/glb/Strawberry.glb"></model-viewer>
    <model-viewer src="assets/glb/Lemon.glb"></model-viewer>
    <model-viewer src="assets/glb/Mango.glb"></model-viewer>
</div>


<script src="js/common.js"></script>
<script src="js/pages/index.js"></script>
</body>
</html>
